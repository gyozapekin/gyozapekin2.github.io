function pad(s){return s;}
function dateLabel(url){
  var m = url.match(/(\d{4})(\d{2})(\d{2})\.jpg$/);
  if(m){return m[1]+'/'+m[2]+'/'+m[3];}
  return '';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hideCard(img){var c=img.closest('.g-card'); if(c){c.style.display='none';}}

function loadGallery(quarter){
  var grid = document.getElementById('grid-'+quarter);
  if(grid.dataset.loaded) return;
  grid.dataset.loaded = '1';
  var imgs = galleryData[quarter] || [];
  var html = '';
  imgs.forEach(function(stem){
    var src = IMGBASE + quarter + '/' + stem + '.jpg';
    var c = captions[src];
    var dlabel = dateLabel(src);
    var altText, dish, catchc, fig;
    if(c){
      altText = c.alt || c.dish;
      dish = esc(c.dish); catchc = esc(c.catch); fig = esc(c.fig);
    } else {
      altText = '海鮮餃子 北京 '+dlabel;
      dish = '海鮮餃子 北京'; catchc = ''; fig = '';
    }
    var axis = Math.random() < 0.5 ? 'flip-y' : 'flip-x';
    html += '<figure class="g-card '+axis+'" onclick="toggleCard(this)">'
          +   '<div class="g-front"><img src="'+src+'" loading="lazy" alt="'+esc(altText)+'" onerror="hideCard(this)"><span class="g-hint">タップで紹介</span></div>'
          +   '<figcaption class="g-back">'
          +     '<p class="g-dish">'+dish+'</p>'
          +     (catchc?'<p class="g-catch">'+catchc+'</p>':'')
          +     (fig?'<p class="g-fig">'+fig+'</p>':'')
          +     '<p class="g-date">'+dlabel+'</p>'
          +   '</figcaption>'
          + '</figure>';
  });
  grid.innerHTML = html;
}

function toggleCard(card){
  card.classList.toggle('revealed');
}

function toggleAccordion(btn){
  var item = btn.parentElement;
  var wasOpen = item.classList.contains('open');
  document.querySelectorAll('.accordion-item').forEach(function(el){el.classList.remove('open');});
  if(!wasOpen){
    item.classList.add('open');
    loadGallery(item.dataset.quarter);
  }
}

document.querySelectorAll('.accordion-item.open').forEach(function(item){
  loadGallery(item.dataset.quarter);
});
