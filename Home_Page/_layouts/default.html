<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ja' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">

<!-- 基本メタ情報 -->
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.title }}">

<!-- 正規URL（重複コンテンツ対策） -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- OGP / Twitter Card -->
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/images/ogp-default.jpg' | absolute_url }}{% endif %}">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/images/ogp-default.jpg' | absolute_url }}{% endif %}">

<!-- 構造化データ: LocalBusiness（飲食店） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "{{ site.restaurant.name }}",
  "url": "{{ '/' | absolute_url }}",
  "image": "{{ '/images/ogp-default.jpg' | absolute_url }}",
  "telephone": "{{ site.restaurant.phone }}",
  "email": "{{ site.restaurant.email }}",
  "priceRange": "¥1,000-¥3,000",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "宮之阪 1-19-2",
    "addressLocality": "枚方市",
    "addressRegion": "大阪府",
    "postalCode": "573-0022",
    "addressCountry": "JP"
  },
  "servesCuisine": ["中華料理", "餃子", "海鮮餃子"],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Thursday", "Friday", "Saturday", "Sunday"],
    "opens": "11:30",
    "closes": "22:00"
  }],
  "hasMenu": "{{ '/menu.html' | absolute_url }}",
  "sameAs": [
    "{{ site.social.x }}",
    "{{ site.social.instagram }}",
    "{{ site.social.youtube }}"
  ],
  "potentialAction": {
    "@type": "OrderAction",
    "target": "{{ site.social.ec }}",
    "deliveryMethod": "http://purl.org/goodrelations/v1#DeliveryModeMail"
  }
}
</script>

<!-- スタイル -->
<link rel="stylesheet" href="{{ '/css/news.css' | relative_url }}">

<!-- ヘッダー/ナビ/背景をメインサイト（index.html）と統一 -->
<style>
  /* 餃子写真の背景（メインページと統一） */
  html,body{margin:0;padding:0;}
  body{background-color:#1a0800;background-image:url('{{ "/images/bg.PNG" | relative_url }}');background-attachment:fixed;background-size:cover;background-position:center center;background-repeat:no-repeat;}
  /* 幅860pxの半透明ラッパー（メインページと統一） */
  .site-wrapper{max-width:860px;margin:0 auto;background:rgba(255,255,255,0.6);box-shadow:0 0 28px rgba(0,0,0,0.55);min-height:100vh;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:hidden;}
  .site-header{background:#F2B800;text-align:center;overflow:hidden;padding:0;}
  .site-header a{display:block;}
  .site-header img.logo{width:100%;max-width:620px;height:auto;display:block;margin:0 auto;}
  .site-nav{background:#ffffff;border-bottom:2px solid #ddd;border-top:1px solid #ccc;}
  .site-nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;margin:0;padding:0;}
  .site-nav ul li{margin:0;}
  .site-nav ul li a{display:block;padding:10px 13px;font-size:13px;font-weight:500;color:#111;text-decoration:none;white-space:nowrap;transition:background .2s;}
  .site-nav ul li a:hover,.site-nav ul li a.active{background:#F2B800;color:#333;font-weight:bold;text-decoration:none;}
  .site-nav ul li a.lang-switch{background:#c0392b;color:#fff;font-weight:bold;border-radius:4px;margin:4px;padding:6px 14px;}
  .site-nav ul li a.lang-switch:hover{background:#e74c3c;color:#fff;}
  /* コンテンツはラッパー内に直接配置（カードの二重化を避ける） */
  .site-main{max-width:none;margin:0;padding:28px 26px 44px;background:transparent;border-radius:0;box-shadow:none;}
  .site-footer{margin-top:0;}
  @media(max-width:640px){.site-nav ul li a{padding:8px 8px;font-size:11px;}.site-main{padding:20px 16px 32px;}}
  /* ドロップダウン＋角丸（2026-06-14） */
  .site-nav ul li a{border-radius:12px;margin:4px 3px;}
  .site-nav li.has-dropdown{position:relative;}
  .site-nav li.has-dropdown>a .caret{font-size:9px;margin-left:4px;vertical-align:middle;}
  .site-nav li.has-dropdown .dropdown{display:none;position:absolute;top:100%;left:0;min-width:168px;background:#fff;border:1px solid #ccc;border-top:3px solid #F2B800;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:200;list-style:none;padding:0;margin:0;border-radius:12px;overflow:hidden;}
  .site-nav li.has-dropdown:hover .dropdown,.site-nav li.has-dropdown:focus-within .dropdown,.site-nav li.has-dropdown.open .dropdown{display:block;}
  .site-nav li.has-dropdown .dropdown li{display:block;}
  .site-nav li.has-dropdown .dropdown li a{display:block;padding:10px 16px;font-size:13px;color:#111;white-space:nowrap;border-bottom:1px solid #eee;border-radius:0;margin:0;}
  .site-nav li.has-dropdown .dropdown li:last-child a{border-bottom:none;}
  .site-nav li.has-dropdown .dropdown li a:hover{background:#fdf6e3;}
  @media(max-width:640px){.site-nav li.has-dropdown .dropdown{position:static;box-shadow:none;border-top:1px solid #eee;min-width:0;}}
</style>

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">

<!-- RSSフィード -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} お知らせ" href="{{ '/feed.xml' | relative_url }}">
</head>

<body>

<!-- 幅860pxラッパー（メインサイトと統一） -->
<div class="site-wrapper">

<!-- ヘッダー（メインサイトと統一：黄色バナー） -->
<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="logo-link" aria-label="海鮮餃子 北京 ホーム">
    <img src="{{ '/images/logo_banner.png' | relative_url }}" alt="海鮮餃子 北京" class="logo"
         onerror="this.style.display='none'; this.parentElement.innerHTML='<h1 style=\'margin:0;color:#c0392b;font-size:2rem;\'>海鮮餃子 北京</h1>';">
  </a>
</header>

<!-- メインナビゲーション（メインサイトと統一） -->
<nav class="site-nav" aria-label="メインメニュー">
  <ul>
    <li><a href="{{ '/' | relative_url }}">ホーム</a></li>
    <li><a href="{{ '/order.html' | relative_url }}">ネットショップ：ECサイト</a></li>
    <li class="has-dropdown">
      <a href="{{ '/menu.html' | relative_url }}">メニュー<span class="caret">▼</span></a>
      <ul class="dropdown">
        <li><a href="{{ '/menu.html' | relative_url }}">日本語メニュー</a></li>
        <li><a href="{{ '/en/menu.html' | relative_url }}">英語メニュー / English</a></li>
      </ul>
    </li>
    <li><a href="{{ '/about.html' | relative_url }}">店舗紹介</a></li>
    <li><a href="{{ '/howto.html' | relative_url }}">餃子の焼き方</a></li>
    <li><a href="{{ '/news/' | relative_url }}" class="active">ブログ</a></li>
    <li class="has-dropdown">
      <a href="{{ '/gallery.html' | relative_url }}">ギャラリー<span class="caret">▼</span></a>
      <ul class="dropdown">
        <li><a href="{{ '/gallery.html' | relative_url }}">写真ギャラリー</a></li>
        <li><a href="{{ '/gallery/shorts.html' | relative_url }}">ショート動画</a></li>
      </ul>
    </li>
    <li><a href="{{ '/contact.html' | relative_url }}">お問合わせ</a></li>
  </ul>
</nav>

<!-- メインコンテンツ -->
<main class="site-main">
  {{ content }}
</main>

<!-- フッター -->
<footer class="site-footer">
  <nav class="footer-nav">
    <a href="{{ '/' | relative_url }}">ホーム</a>
    <a href="{{ '/menu.html' | relative_url }}">メニュー</a>
    <a href="{{ '/about.html' | relative_url }}">店舗紹介</a>
    <a href="{{ '/contact.html' | relative_url }}">お問合わせ</a>
    <a href="{{ '/news/' | relative_url }}">ブログ</a>
  </nav>
  <p class="copyright">&copy; 海鮮餃子 北京 All Rights Reserved.</p>
  <p class="address">{{ site.restaurant.address }}　電話: <a href="tel:{{ site.restaurant.phone }}">{{ site.restaurant.phone }}</a></p>
</footer>

</div>
<script>
document.querySelectorAll('.site-nav li.has-dropdown > a').forEach(function(a){a.addEventListener('click',function(e){if(window.matchMedia('(max-width: 640px)').matches){e.preventDefault();a.parentElement.classList.toggle('open');}});});
</script>
</body>
</html>
